<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Pulse is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f8f9fc;
        color: #171421;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e7e3ef;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgba(31, 24, 54, 0.12);
        padding: 28px;
      }

      .mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: #7c3aed;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        color: #6b6478;
        font-size: 15px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 22px;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #7c3aed;
        color: #ffffff;
        padding: 0 16px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Pulse is offline</h1>
      <p>
        Your saved app shell is still here. Reconnect to load the latest tasks,
        reminders, and calendar details.
      </p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
