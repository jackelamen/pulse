<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1152"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="bolt" x1="200" y1="80" x2="312" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ecg" x1="60" y1="256" x2="452" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#e879f9"/>
      <stop offset="0.8" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Lightning bolt -->
  <path
    d="M296 68 L180 276 L240 276 L216 444 L332 236 L272 236 Z"
    fill="url(#bolt)"
    filter="url(#glow)"
  />

  <!-- ECG / pulse line cutting through the bolt horizontally -->
  <path
    d="M60 256 L148 256 L172 210 L196 302 L220 256 L260 256 L284 210 L308 302 L332 256 L452 256"
    fill="none"
    stroke="url(#ecg)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
