<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shell" x1="52" y1="30" x2="460" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1152"/>
      <stop offset=".52" stop-color="#2d1b8a"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="bolt-fill" x1="200" y1="80" x2="310" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e879f9"/>
      <stop offset=".5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bolt-sheen" x1="200" y1="80" x2="270" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square — same shape as original -->
  <rect width="512" height="512" rx="118" fill="url(#shell)"/>

  <!-- Subtle inner glow ring, like the original circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity=".35"/>

  <!-- Lightning bolt with glow -->
  <path
    d="M292 68 L172 278 L238 278 L220 444 L340 234 L274 234 Z"
    fill="url(#bolt-fill)"
    filter="url(#glow)"
  />
  <!-- Sheen overlay on bolt -->
  <path
    d="M292 68 L172 278 L238 278 L220 444 L340 234 L274 234 Z"
    fill="url(#bolt-sheen)"
  />

  <!-- ECG / pulse line — same style as original, white, crossing the bolt -->
  <path
    d="M68 268 L148 268 L176 188 L210 348 L238 268 L274 268 L302 188 L336 348 L364 268 L444 268"
    fill="none"
    stroke="#fff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
